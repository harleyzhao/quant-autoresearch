<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arbor viewer</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc3e6; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #status {
        position: fixed; left: 12px; bottom: 12px; max-width: calc(100% - 340px);
        padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #fff;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; pointer-events: none;
      }
      #pane { position: fixed; top: 8px; right: 8px; width: 300px; max-height: calc(100% - 16px); overflow-y: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">loading…</div>
    <div id="pane"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
